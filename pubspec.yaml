name: flowprompt
description: "A script prompter app for tablets."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0
  # sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Local packages
  utilities:
    path: ../utilities

  # State management
  signals: ^6.2.0

  # Navigation
  auto_route: ^9.3.0+1

  # UI
  google_fonts: ^6.1.0
  auto_size_text: ^3.0.0
  flutter_markdown: ^0.7.7+1

  # File handling
  file_picker: ^8.1.7

  # Google Drive
  google_sign_in: ^6.2.2
  googleapis: ^14.0.0
  http: ^1.3.0

  # Persistence
  shared_preferences: ^2.5.2

  # Logging
  lumberdash: ^3.0.0
  colorize_lumberdash: ^3.0.0

  # Utilities
  collection: ^1.19.1
  wakelock_plus: ^1.2.11
  cupertino_icons: ^1.0.8
  syncfusion_flutter_pdfviewer: ^32.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.15

  # App icon
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
