name: flowprompt
description: "A script prompter app for tablets."
publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Local packages
  utilities:
    path: ../utilities

  # State management
  signals: ^7.1.0

  # Navigation
  auto_route: ^11.1.0

  # UI
  google_fonts: ^8.1.0
  auto_size_text: ^3.0.0
  flutter_markdown: ^0.7.7+1

  # File handling
  file_picker: ^8.3.7

  # Google Drive
  google_sign_in: ^6.3.0
  googleapis: ^16.0.0
  http: ^1.6.0

  # Persistence
  shared_preferences: ^2.5.5

  # Logging
  lumberdash: ^3.0.0
  colorize_lumberdash: ^3.0.0

  # Utilities
  collection: ^1.19.1
  wakelock_plus: ^1.5.2
  cupertino_icons: ^1.0.9
  syncfusion_flutter_pdfviewer: ^33.2.13
  flutter_widget_from_html: ^0.17.2
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.0

  # App icon
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_adaptive.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/app_icon_splash.png"
  android_12:
    image: "assets/images/app_icon_splash.png"
    color: "#ffffff"

